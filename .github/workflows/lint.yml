# SPDX-License-Identifier: GPL-2.0+
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck runtime/mmcli.sh \
                    runtime/lib/*.sh \
                    runtime/adapters/*.sh \
                    scripts/*.sh

  bash-syntax:
    name: bash syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check syntax
        run: |
          for f in runtime/mmcli.sh \
                   runtime/lib/*.sh \
                   runtime/adapters/*.sh \
                   scripts/*.sh; do
            bash -n "$f" || (echo "syntax error in $f"; exit 1)
          done