# SPDX-License-Identifier: GPL-2.0+
name: check-anchor

on:
  schedule:
    # Every Sunday 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  check-anchor:
    name: Anchor integrity
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.22.0'
          - '1.24.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 01-anchor.patch contains anchor string
        run: |
          if ! grep -q QUECTEL_THROUGHPUT_ANCHOR \
              patches/${{ matrix.version }}/01-anchor.patch; then
            echo "FAIL: patches/${{ matrix.version }}/01-anchor.patch missing anchor"
            exit 1
          fi

      - name: Clone upstream and apply
        run: |
          set -e
          git clone --depth 1 --branch ${{ matrix.version }} \
            https://github.com/linux-mobile-broadband/ModemManager.git \
            /tmp/mm

          if [ ! -f patches/${{ matrix.version }}/source.json ]; then
            echo "SKIP: no source.json for ${{ matrix.version }}"
            exit 0
          fi

          # Only check tested versions
          if ! grep -q '"tested_at": *"[^"]\+"' patches/${{ matrix.version }}/source.json; then
            echo "SKIP: tested_at is empty for ${{ matrix.version }}"
            exit 0
          fi

          cd /tmp/mm
          if ! git apply $GITHUB_WORKSPACE/patches/${{ matrix.version }}/01-anchor.patch; then
            echo "FAIL: 01-anchor.patch does not apply on upstream ${{ matrix.version }}"
            exit 1
          fi

          count=$(grep -rc QUECTEL_THROUGHPUT_ANCHOR src/mm-port-qmi.c || echo 0)
          if [ "$count" -ne 1 ]; then
            echo "FAIL: anchor count is $count (expected 1)"
            exit 1
          fi
          echo "OK: anchor survives on upstream ${{ matrix.version }}"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `check-anchor: ${{ matrix.version }} failed`,
              body: `The \`check-anchor\` workflow detected a problem with patches/${{ matrix.version }}/01-anchor.patch.

            This usually means upstream ModemManager has refactored the section where the anchor is inserted.

            See docs/anchor-strategy.md for rebase instructions.`,
              labels: ['upstream-compat', 'needs-rebase']
            });