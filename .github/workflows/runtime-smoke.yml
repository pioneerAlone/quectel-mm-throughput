# SPDX-License-Identifier: GPL-2.0+
name: runtime-smoke

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  bats:
    name: bats tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats
        run: |
          bats tests/*.bats

      - name: Verify patch apply on fresh upstream
        run: |
          set -e
          git clone --depth 1 --branch 1.22.0 \
            https://github.com/linux-mobile-broadband/ModemManager.git \
            /tmp/mm
          cd /tmp/mm
          for p in $GITHUB_WORKSPACE/patches/1.22.0/*.patch; do
            git apply "$p"
          done
          grep -c QUECTEL_THROUGHPUT_ANCHOR src/mm-port-qmi.c